name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  build-desktop:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.goos }}" == windows ]]; then ext=".exe"; fi
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -o "dist/fp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/fp
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK and instrumentation test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Build APK and Android backend
        run: |
          mkdir -p dist
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o dist/fp-android-arm64 ./cmd/fp
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/30.0.16248370" make build-android-apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: make android-test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fp-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/fp-android-arm64
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build iOS device and Simulator apps; simulator smoke test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS simulator app
        run: make build-ios
      - name: Launch app in iPhone simulator
        run: |
          xcrun simctl boot "iPhone 16"
          xcrun simctl bootstatus "iPhone 16" -b
          xcrun simctl install "iPhone 16" ios/build/DerivedData/Build/Products/Debug-iphonesimulator/FlightPicture.app
          xcrun simctl launch "iPhone 16" com.fp.flightpicture
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fp-ios
          path: |
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/FlightPicture.app
            ios/build/DerivedData/Build/Products/Debug-iphoneos/FlightPicture.app
          if-no-files-found: error
          retention-days: 7
