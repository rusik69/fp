name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  build-desktop:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.goos }}" == windows ]]; then ext=".exe"; fi
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 \
            go build -o "dist/fp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/fp
      - uses: actions/upload-artifact@v4
        with:
          name: fp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK and instrumentation test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Build APK and Android backend
        run: |
          mkdir -p dist
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o dist/fp-android-arm64 ./cmd/fp
          make build-android-apk
      - name: Run Android instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37.0
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: make android-test
      - uses: actions/upload-artifact@v4
        with:
          name: fp-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            dist/fp-android-arm64
          if-no-files-found: error
          retention-days: 7

  build-ios-backend:
    name: Build iOS Go backend
    runs-on: macos-15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: xcodebuild -version
      - run: mkdir -p dist && GOOS=ios GOARCH=arm64 go build -o dist/httpapi-ios-arm64.a ./internal/httpapi
      - uses: actions/upload-artifact@v4
        with:
          name: fp-ios-backend
          path: dist/httpapi-ios-arm64.a
          if-no-files-found: error
          retention-days: 7
